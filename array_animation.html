<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열 한 줄씩 실행</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1d2433;
      --muted: #667085;
      --line: #e2e6ef;
      --accent: #ff7a3d;
      --accent-soft: #fff1e8;
      --done: #e3f6ea;
      --done-ink: #1f7a45;
      --code-bg: #1e2433;
      --code-ink: #e6e9f0;
      --code-hl: #3a4a6b;
      --comment: #8b95a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      padding: 20px 16px 8px;
      max-width: 1180px;
      margin: 0 auto;
    }

    header h1 { font-size: 1.4rem; }
    header p  { color: var(--muted); font-size: 0.95rem; }

    .layout {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    .panel h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ===== 코드 ===== */
    .code {
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 10px;
      padding: 10px 0;
      font-family: Consolas, "D2Coding", monospace;
      font-size: 0.92rem;
      overflow-x: auto;
    }

    .code-line {
      display: flex;
      padding: 2px 12px 2px 0;
      white-space: pre;
      border-left: 4px solid transparent;
      transition: background 0.2s;
    }

    .code-line .no {
      width: 36px;
      flex: none;
      text-align: right;
      padding-right: 12px;
      color: #5d6880;
      user-select: none;
    }

    .code-line .cm { color: var(--comment); }
    .code-line .warn { color: #ffb38a; }

    .code-line.active {
      background: var(--code-hl);
      border-left-color: var(--accent);
    }

    /* ===== 설명 ===== */
    .explain {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: var(--accent-soft);
      min-height: 92px;
      font-size: 0.98rem;
    }

    .explain b { color: #c2470f; }
    .explain code {
      font-family: Consolas, monospace;
      background: #ffffffaa;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .calc {
      display: block;
      margin-top: 8px;
      font-family: Consolas, monospace;
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* ===== 조작 버튼 ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    button, select, input {
      font: inherit;
      font-size: 0.92rem;
    }

    button {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--bg); }
    button:disabled { opacity: 0.4; cursor: default; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.primary:hover:not(:disabled) { background: #e8662b; }

    select, input {
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }

    .progress {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .bar {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .bar div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.2s;
    }

    /* ===== 변수 ===== */
    .vars {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .var {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 64px;
    }

    .var .name {
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .var .val {
      font-family: Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 700;
      word-break: break-all;
    }

    .var.empty .val { color: #c3c9d4; font-size: 0.9rem; font-weight: 400; }
    .var.small .val { font-size: 0.85rem; }

    .var.flash { animation: flash 0.6s ease; }

    @keyframes flash {
      0%   { background: #ffd8c2; transform: scale(1.06); }
      100% { background: transparent; transform: none; }
    }

    /* ===== 배열 상자 ===== */
    .array {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
    }

    .box {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
      padding: 4px 0 2px;
      font-family: Consolas, monospace;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--card);
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .box small {
      display: block;
      font-size: 0.62rem;
      font-weight: 400;
      color: var(--muted);
    }

    .array.hidden .box { visibility: hidden; }

    .array.appear .box {
      animation: pop 0.35s ease backwards;
      animation-delay: calc(var(--i) * 8ms);
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: none; }
    }

    .box.done { background: var(--done); color: var(--done-ink); }

    .box.current {
      background: var(--accent);
      color: #fff;
      transform: scale(1.12);
      z-index: 1;
      box-shadow: 0 4px 10px rgba(255, 122, 61, 0.4);
    }

    .box.current small { color: #ffe6d9; }

    .box.peek { outline: 3px solid #3b82f6; outline-offset: 1px; }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: -1px;
      background: var(--sw);
      border: 1px solid var(--line);
    }

    .try {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.92rem;
    }

    .try input { width: 76px; }

    .try-result {
      font-family: Consolas, monospace;
      font-weight: 700;
    }

    /* ===== 콘솔 ===== */
    .console {
      background: #111622;
      color: #9ef0b5;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: Consolas, monospace;
      min-height: 96px;
      font-size: 0.95rem;
    }

    .console .ln::before { content: "› "; color: #59627a; }
    .console .ln.new { animation: flash-ln 0.6s ease; }
    .console .placeholder { color: #59627a; }

    @keyframes flash-ln {
      from { background: #2b3a2f; }
      to   { background: transparent; }
    }

    .side { display: grid; gap: 16px; align-content: start; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .vars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .box { font-size: 0.75rem; }
      .box small { font-size: 0.55rem; }
      .progress { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html#study" style="color:var(--muted);text-decoration:none;font-size:0.9rem">← 학습 목록으로</a>
    <h1>🧮 자바스크립트 배열, 한 줄씩 실행해 보기</h1>
    <p>"다음 ▶"을 누를 때마다 코드가 한 줄씩 실행되고, 변수·배열·콘솔이 어떻게 바뀌는지 보여 줍니다. (키보드 → ← , 스페이스도 됩니다)</p>
  </header>

  <div class="layout">
    <!-- 왼쪽: 코드 + 설명 + 조작 -->
    <section class="panel">
      <h2>📄 코드 (지금 실행되는 줄이 강조됩니다)</h2>
      <div class="code" id="code"></div>

      <div class="explain" id="explain"></div>

      <div class="controls">
        <button id="btnReset" title="처음으로">⏮ 처음</button>
        <button id="btnPrev">◀ 이전</button>
        <button id="btnNext" class="primary">다음 ▶</button>
        <button id="btnPlay">▶ 자동 재생</button>
        <select id="speed" aria-label="재생 속도">
          <option value="1400">느리게</option>
          <option value="700" selected>보통</option>
          <option value="150">빠르게</option>
        </select>
        <button id="btnSkip" title="반복문을 끝까지 실행">⏭ 반복 끝까지</button>
        <span class="progress" id="progress"></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </section>

    <!-- 오른쪽: 변수, 배열, 콘솔 -->
    <div class="side">
      <section class="panel">
        <h2>📦 변수 (값이 바뀌면 깜빡입니다)</h2>
        <div class="vars" id="vars"></div>
      </section>

      <section class="panel">
        <h2>🗃️ 배열 data — 위 숫자는 값, 아래 [ ]는 인덱스(번호)</h2>
        <div class="array hidden" id="array"></div>
        <div class="legend">
          <span style="--sw: var(--accent)">지금 꺼낸 값</span>
          <span style="--sw: var(--done)">이미 더한 값</span>
          <span style="--sw: #fff; ">아직 안 쓴 값</span>
        </div>
        <div class="try">
          🔍 직접 해보기: <code>data[</code>
          <input type="number" id="tryIndex" value="0" min="0" max="120" aria-label="인덱스">
          <code>]</code>
          <button id="btnTry">꺼내 보기</button>
          <span class="try-result" id="tryResult"></span>
        </div>
      </section>

      <section class="panel">
        <h2>🖥️ 콘솔 (console.log 출력)</h2>
        <div class="console" id="console"></div>
      </section>
    </div>
  </div>

  <script>
    // ===== 실습 데이터 =====
    const data = Array.from({ length: 100 }, (_, i) => i + 1);

    // 화면에 보여 줄 코드 (원래 코드를 정리하고 오류 한 곳을 고친 버전)
    const CODE = [
      "const data = [1, 2, 3, … , 100];",
      "console.log(data[0]);",
      "",
      "let sum = 10;",
      "sum = sum + 7;          // sum += 7 과 같음",
      "console.log(sum);       // 17",
      "let cnt = 8;",
      "cnt = cnt + 1;          // cnt += 1, cnt++ 과 같음",
      "",
      "for (const element of data) {",
      "  sum += element;       // ⚠ 원래 코드: sum += i",
      "}",
      "console.log(sum);"
    ];

    // ===== 단계(step) 만들기 =====
    // 각 단계는 상태(state)를 바꾸는 함수와, 화면에 보여 줄 설명을 가집니다.
    const steps = [];

    steps.push({
      line: -1,
      explain: '👋 준비 완료! <b>"다음 ▶"</b>을 눌러 첫 줄부터 실행해 보세요.',
      apply: function () {}
    });

    steps.push({
      line: 0,
      explain: '<b>배열(array)</b>은 여러 값을 한 줄로 담는 상자 묶음입니다.<br>' +
               '1부터 100까지 숫자 <b>100개</b>가 <code>data</code>라는 이름으로 저장됐어요.<br>' +
               '각 상자에는 <b>0번부터</b> 번호(인덱스)가 붙습니다. 그래서 마지막 상자는 99번이에요.',
      apply: function (s) {
        s.arrayShown = true;
        s.appear = true;
        s.vars.data = "[1, 2, …, 100]";
        s.changed = "data";
      }
    });

    steps.push({
      line: 1,
      explain: '<code>data[0]</code>은 "data 배열의 <b>0번 상자</b>를 꺼내라"는 뜻입니다.<br>' +
               '0번 상자에는 <b>1</b>이 들어 있으니 콘솔에 1이 찍혀요.<br>' +
               '💡 대괄호 안 숫자를 바꾸면 다른 상자를 꺼냅니다. 아래 "직접 해보기"로 바꿔 보세요!' +
               '<span class="calc">data[0] → 1</span>',
      apply: function (s) {
        s.current = 0;
        s.logs.push("1");
      }
    });

    steps.push({
      line: 3,
      explain: '<code>let</code>으로 <b>sum</b>이라는 변수를 만들고 10을 넣었습니다.<br>' +
               '변수는 값을 담아 두는 이름표 붙은 상자예요.' +
               '<span class="calc">sum = 10</span>',
      apply: function (s) {
        s.current = -1;
        s.vars.sum = 10;
        s.changed = "sum";
      }
    });

    steps.push({
      line: 4,
      explain: '오른쪽을 먼저 계산한 다음, 그 결과를 왼쪽 sum에 다시 넣습니다.<br>' +
               '<code>sum += 7</code>이라고 줄여 써도 똑같아요.' +
               '<span class="calc">sum = 10 + 7 = 17</span>',
      apply: function (s) {
        s.vars.sum = 17;
        s.changed = "sum";
      }
    });

    steps.push({
      line: 5,
      explain: '지금 sum에 들어 있는 값 <b>17</b>을 콘솔에 출력합니다.',
      apply: function (s) {
        s.logs.push("17");
      }
    });

    steps.push({
      line: 6,
      explain: '<b>cnt</b>(count, 개수 세기용) 변수를 만들고 8을 넣었습니다.' +
               '<span class="calc">cnt = 8</span>',
      apply: function (s) {
        s.vars.cnt = 8;
        s.changed = "cnt";
      }
    });

    steps.push({
      line: 7,
      explain: '1을 더해 다시 cnt에 넣습니다. <code>cnt += 1</code>, <code>cnt++</code> 모두 같은 뜻이에요.<br>' +
               '(cnt는 이 코드에서 이후에 쓰이지 않아요.)' +
               '<span class="calc">cnt = 8 + 1 = 9</span>',
      apply: function (s) {
        s.vars.cnt = 9;
        s.changed = "cnt";
      }
    });

    // 반복문: 100번 반복하는 단계를 하나씩 만들기
    const loopStart = steps.length;
    let running = 17;

    data.forEach(function (value, k) {
      const before = running;
      running += value;
      const after = running;

      let extra = "";
      if (k === 0) {
        extra = '<b>for…of 반복문</b>은 배열에서 값을 <b>앞에서부터 하나씩</b> 꺼내 <code>element</code>에 담고 { } 안을 실행합니다.<br>' +
                '⚠ 원래 코드의 <code>sum += i</code>는 <b>i라는 변수가 없어서 오류</b>가 납니다. 꺼낸 값의 이름은 <code>element</code>이니 <code>sum += element</code>로 고쳐야 해요.<br>';
      } else if (k === 99) {
        extra = '마지막 상자(99번)까지 왔어요!<br>';
      }

      steps.push({
        line: 10,
        explain: extra +
                 '<b>' + (k + 1) + '번째 반복</b>: <code>data[' + k + ']</code>를 꺼내 element = <b>' + value + '</b>' +
                 '<span class="calc">sum = ' + before + ' + ' + value + ' = ' + after + '</span>',
        apply: function (s) {
          s.current = k;
          s.done = k;
          s.vars.element = value;
          s.vars.sum = after;
          s.changed = "sum";
          s.changed2 = "element";
        }
      });
    });

    const loopEnd = steps.length - 1;

    steps.push({
      line: 11,
      explain: '더 꺼낼 값이 없으니 <b>반복문을 빠져나옵니다.</b><br>' +
               '<code>element</code>는 반복문 { } 안에서만 쓰는 변수라 이제 사라졌어요.<br>' +
               'sum에는 처음 값 17에 1~100의 합 5050이 누적되었습니다.' +
               '<span class="calc">sum = 17 + 5050 = 5067</span>',
      apply: function (s) {
        s.current = -1;
        s.done = 100;
        delete s.vars.element;
      }
    });

    steps.push({
      line: 12,
      explain: '최종 누적된 총합 <b>5067</b>을 출력합니다. 🎉<br>' +
               '💡 1~100의 합(5050)만 구하고 싶다면 반복문 전에 <code>sum = 0</code>으로 시작하면 됩니다.',
      apply: function (s) {
        s.logs.push("5067");
      }
    });

    // ===== 상태 계산 =====
    // 처음부터 n번째 단계까지 다시 실행해서 상태를 만듭니다. (이전 버튼이 쉬워짐)
    function buildState(n) {
      const s = { vars: {}, logs: [], current: -1, done: 0, arrayShown: false };
      for (let i = 0; i <= n; i++) {
        s.changed = null;
        s.changed2 = null;
        s.appear = false;
        steps[i].apply(s);
      }
      return s;
    }

    // ===== 화면 그리기 =====
    const $ = function (id) { return document.getElementById(id); };
    const codeEl = $("code");
    const arrayEl = $("array");

    function escapeHtml(t) {
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 코드 줄 그리기 (주석은 회색으로)
    CODE.forEach(function (text, i) {
      const row = document.createElement("div");
      row.className = "code-line";
      const idx = text.indexOf("//");
      let html = escapeHtml(text);
      if (idx >= 0) {
        const cls = text.indexOf("⚠") >= 0 ? "cm warn" : "cm";
        html = escapeHtml(text.slice(0, idx)) + '<span class="' + cls + '">' + escapeHtml(text.slice(idx)) + "</span>";
      }
      row.innerHTML = '<span class="no">' + (i + 1) + "</span>" + (html || " ");
      codeEl.appendChild(row);
    });

    // 배열 상자 100개 만들기
    data.forEach(function (v, i) {
      const box = document.createElement("div");
      box.className = "box";
      box.style.setProperty("--i", i);
      box.innerHTML = v + "<small>[" + i + "]</small>";
      arrayEl.appendChild(box);
    });

    const boxes = arrayEl.children;
    const codeLines = codeEl.children;
    let stepIndex = 0;
    let prevLogCount = 0;

    function render() {
      const s = buildState(stepIndex);
      const step = steps[stepIndex];

      // 코드 강조
      for (let i = 0; i < codeLines.length; i++) {
        codeLines[i].classList.toggle("active", i === step.line);
      }
      // 반복 중에는 for 줄도 함께 강조
      if (step.line === 10) codeLines[9].classList.add("active");

      // 설명
      $("explain").innerHTML = step.explain;

      // 변수
      const names = ["data", "sum", "cnt", "element"];
      $("vars").innerHTML = names.map(function (name) {
        const has = Object.prototype.hasOwnProperty.call(s.vars, name);
        const cls = ["var"];
        if (!has) cls.push("empty");
        if (name === "data" && has) cls.push("small");
        if (name === s.changed || name === s.changed2) cls.push("flash");
        return '<div class="' + cls.join(" ") + '"><div class="name">' + name + '</div><div class="val">' +
               (has ? s.vars[name] : "아직 없음") + "</div></div>";
      }).join("");

      // 배열
      arrayEl.classList.toggle("hidden", !s.arrayShown);
      arrayEl.classList.remove("appear");
      if (s.appear) {
        void arrayEl.offsetWidth; // 애니메이션 다시 시작
        arrayEl.classList.add("appear");
      }
      for (let i = 0; i < boxes.length; i++) {
        boxes[i].classList.toggle("done", i < s.done);
        boxes[i].classList.toggle("current", i === s.current);
      }

      // 콘솔
      if (s.logs.length === 0) {
        $("console").innerHTML = '<span class="placeholder">아직 출력된 내용이 없어요</span>';
      } else {
        $("console").innerHTML = s.logs.map(function (l, i) {
          const isNew = i >= prevLogCount;
          return '<div class="ln' + (isNew ? " new" : "") + '">' + l + "</div>";
        }).join("");
      }
      prevLogCount = s.logs.length;

      // 진행 상태
      $("progress").textContent = "단계 " + stepIndex + " / " + (steps.length - 1);
      $("bar").style.width = (stepIndex / (steps.length - 1) * 100) + "%";
      $("btnPrev").disabled = stepIndex === 0;
      $("btnNext").disabled = stepIndex === steps.length - 1;
      $("btnSkip").disabled = stepIndex >= loopEnd;
    }

    function go(n) {
      stepIndex = Math.max(0, Math.min(steps.length - 1, n));
      render();
      if (stepIndex === steps.length - 1) stopPlay();
    }

    // ===== 자동 재생 =====
    let timer = null;

    function play() {
      if (stepIndex === steps.length - 1) go(0);
      $("btnPlay").textContent = "⏸ 멈춤";
      timer = setInterval(function () { go(stepIndex + 1); }, Number($("speed").value));
    }

    function stopPlay() {
      clearInterval(timer);
      timer = null;
      $("btnPlay").textContent = "▶ 자동 재생";
    }

    function togglePlay() { timer ? stopPlay() : play(); }

    // ===== 버튼 연결 =====
    $("btnNext").onclick = function () { stopPlay(); go(stepIndex + 1); };
    $("btnPrev").onclick = function () { stopPlay(); go(stepIndex - 1); };
    $("btnReset").onclick = function () { stopPlay(); prevLogCount = 0; go(0); };
    $("btnPlay").onclick = togglePlay;
    $("btnSkip").onclick = function () {
      stopPlay();
      go(stepIndex < loopStart ? loopStart : loopEnd);
    };
    $("speed").onchange = function () { if (timer) { stopPlay(); play(); } };

    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === "ArrowRight") { stopPlay(); go(stepIndex + 1); }
      else if (e.key === "ArrowLeft") { stopPlay(); go(stepIndex - 1); }
      else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    });

    // ===== 직접 해보기: data[n] 꺼내기 =====
    function tryIndex() {
      const n = Number($("tryIndex").value);
      for (let i = 0; i < boxes.length; i++) boxes[i].classList.remove("peek");

      if (!Number.isInteger(n)) {
        $("tryResult").textContent = "정수를 입력해 주세요";
        return;
      }
      if (n >= 0 && n < data.length) {
        boxes[n].classList.add("peek");
        $("tryResult").textContent = "data[" + n + "] → " + data[n];
      } else {
        $("tryResult").textContent = "data[" + n + "] → undefined (그 번호의 상자가 없어요)";
      }
    }

    $("btnTry").onclick = tryIndex;
    $("tryIndex").addEventListener("keydown", function (e) { if (e.key === "Enter") tryIndex(); });

    render();
  </script>
</body>
</html>
