<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과일 장바구니 배열</title>
  <style>
    :root {
      --bg: #f5f7f2;
      --card: #ffffff;
      --ink: #1f2a1f;
      --muted: #667066;
      --line: #e1e6dc;
      --accent: #2f9e58;
      --accent-dark: #237a43;
      --accent-soft: #eaf7ee;
      --hot: #ff7a3d;
      --hot-soft: #fff1e8;
      --code-bg: #1d2420;
      --code-ink: #e7ece8;
      --code-hl: #34503f;
      --code-hl2: #2a3a31;
      --comment: #8fa196;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 6px;
    }

    header h1 { font-size: 1.4rem; }
    header p  { color: var(--muted); font-size: 0.95rem; }

    .layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    .panel h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .side { display: grid; gap: 16px; }
    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

    /* ===== 코드 ===== */
    .code {
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 10px;
      padding: 10px 0;
      font-family: Consolas, "D2Coding", monospace;
      font-size: 0.9rem;
      overflow-x: auto;
    }

    .code-line {
      display: flex;
      padding: 2px 12px 2px 0;
      white-space: pre;
      border-left: 4px solid transparent;
      transition: background 0.2s;
    }

    .code-line .no {
      width: 34px;
      flex: none;
      text-align: right;
      padding-right: 12px;
      color: #5f7266;
      user-select: none;
    }

    .code-line .cm { color: var(--comment); }
    .code-line.active { background: var(--code-hl); border-left-color: var(--hot); }
    .code-line.related { background: var(--code-hl2); border-left-color: #7fd3a0; }

    /* ===== 설명 ===== */
    .explain {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: var(--hot-soft);
      min-height: 110px;
    }

    .explain b { color: #c2470f; }
    .explain code {
      font-family: Consolas, monospace;
      background: #ffffffb0;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .calc {
      display: block;
      margin-top: 8px;
      font-family: Consolas, monospace;
      font-size: 1.12rem;
      font-weight: 700;
    }

    /* ===== 조작 ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    button, select, input { font: inherit; font-size: 0.92rem; }

    button {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--bg); }
    button:disabled { opacity: 0.4; cursor: default; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.primary:hover:not(:disabled) { background: var(--accent-dark); }

    select, input {
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }

    .progress { margin-left: auto; color: var(--muted); font-size: 0.88rem; }

    .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }

    /* ===== 배열 cart: 진열대 ===== */
    .shelf {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .slot {
      position: relative;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 26px 8px 10px;
      text-align: center;
      background: var(--card);
      transition: border-color 0.2s, background 0.2s, transform 0.2s, opacity 0.2s;
    }

    .slot .idx {
      position: absolute;
      top: 6px;
      left: 8px;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      background: #6b7a6f;
      border-radius: 6px;
      padding: 0 6px;
    }

    .slot .emoji { font-size: 2.4rem; line-height: 1.1; }
    .slot .name  { font-weight: 800; margin-top: 2px; }

    .slot dl {
      margin-top: 6px;
      font-size: 0.82rem;
      font-family: Consolas, monospace;
      text-align: left;
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 0 6px;
    }

    .slot dt { color: var(--muted); }
    .slot dd { font-weight: 700; }

    .shelf.hidden .slot { visibility: hidden; }
    .shelf.appear .slot { animation: pop 0.45s ease backwards; animation-delay: calc(var(--i) * 150ms); }

    @keyframes pop {
      from { opacity: 0; transform: translateY(16px) scale(0.8); }
      to   { opacity: 1; transform: none; }
    }

    .slot.current {
      border-color: var(--hot);
      background: var(--hot-soft);
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(255, 122, 61, 0.25);
    }

    .slot.current .idx { background: var(--hot); }
    .slot.done { opacity: 0.55; }
    .slot.done::after {
      content: "✔ 계산 완료";
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.72rem;
      color: var(--accent-dark);
      font-weight: 700;
    }

    .slot.peek { outline: 3px solid #3b82f6; outline-offset: 2px; }
    .slot .hl { background: #ffe08a; border-radius: 4px; }

    .shelf-note {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      font-family: Consolas, monospace;
    }

    .try {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.92rem;
    }

    .try code { font-family: Consolas, monospace; font-weight: 700; }
    .try input { width: 64px; }
    .try-result { font-family: Consolas, monospace; font-weight: 700; color: #2457c5; }

    /* ===== 변수 ===== */
    .vars { display: grid; gap: 8px; }

    .var {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .var .name { font-family: Consolas, monospace; font-size: 0.85rem; color: var(--muted); }
    .var .val  { font-family: Consolas, monospace; font-weight: 700; text-align: right; word-break: break-all; }
    .var.empty .val { color: #c2c9c2; font-weight: 400; font-size: 0.88rem; }
    .var.flash { animation: flash 0.7s ease; }

    @keyframes flash {
      0%   { background: #ffd8c2; transform: scale(1.04); }
      100% { background: transparent; transform: none; }
    }

    /* ===== 장바구니 ===== */
    .basket {
      min-height: 120px;
      border: 2px dashed #c9d6c9;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-content: flex-start;
      font-size: 1.5rem;
      background: #fbfdf9;
    }

    .basket .empty { font-size: 0.9rem; color: var(--muted); }
    .basket .fruit.drop { animation: drop 0.45s cubic-bezier(.3,1.5,.6,1) backwards; }

    @keyframes drop {
      from { opacity: 0; transform: translateY(-40px) rotate(-30deg); }
      to   { opacity: 1; transform: none; }
    }

    .counts { margin-top: 8px; font-size: 0.88rem; color: var(--muted); }

    /* ===== 영수증 ===== */
    .receipt {
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      background: #fffdf6;
      border: 1px solid #efe6c8;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .receipt .r-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px dotted #e3d9b8;
    }

    .receipt .r-line.new { animation: flash 0.7s ease; }
    .receipt .empty { color: var(--muted); font-size: 0.85rem; }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 8px;
      font-weight: 800;
    }

    .total .amount { font-size: 1.5rem; color: var(--accent-dark); }

    /* ===== 콘솔 ===== */
    .console {
      background: #111a15;
      color: #9ef0b5;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: Consolas, monospace;
      min-height: 80px;
      font-size: 0.95rem;
    }

    .console .ln::before { content: "› "; color: #5a6b60; }
    .console .ln.new { animation: flash-ln 0.7s ease; }
    .console .placeholder { color: #5a6b60; }

    @keyframes flash-ln { from { background: #2c4434; } to { background: transparent; } }

    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .progress { margin-left: 0; width: 100%; }
    }

    @media (max-width: 520px) {
      .row2 { grid-template-columns: minmax(0, 1fr); }
      .slot { padding: 24px 4px 8px; }
      .slot .emoji { font-size: 1.9rem; }
      .slot dl { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html#study" style="color:var(--muted);text-decoration:none;font-size:0.9rem">← 학습 목록으로</a>
    <h1>🛒 과일 장바구니로 배우는 자바스크립트 배열</h1>
    <p>사과·배·귤을 배열에 담고, 반복문으로 하나씩 꺼내 총 구매가격을 계산해 봅니다. "다음 ▶"을 눌러 한 줄씩 실행하세요. (키보드 → ← , 스페이스)</p>
  </header>

  <div class="layout">
    <!-- 왼쪽: 코드 / 설명 / 조작 -->
    <section class="panel">
      <h2>📄 코드</h2>
      <div class="code" id="code"></div>
      <div class="explain" id="explain"></div>

      <div class="controls">
        <button id="btnReset">⏮ 처음</button>
        <button id="btnPrev">◀ 이전</button>
        <button id="btnNext" class="primary">다음 ▶</button>
        <button id="btnPlay">▶ 자동 재생</button>
        <select id="speed" aria-label="재생 속도">
          <option value="3000">느리게</option>
          <option value="1800" selected>보통</option>
          <option value="900">빠르게</option>
        </select>
        <span class="progress" id="progress"></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </section>

    <!-- 오른쪽 -->
    <div class="side">
      <section class="panel">
        <h2>🗃️ 배열 cart — 상자 3칸, 번호(인덱스)는 0부터</h2>
        <div class="shelf hidden" id="shelf"></div>
        <div class="shelf-note" id="shelfNote">cart.length = ?</div>

        <div class="try">
          🔍 직접 해보기:
          <code>cart[</code>
          <input type="number" id="tryIndex" value="1" min="0" max="5" aria-label="인덱스">
          <code>].</code>
          <select id="tryProp" aria-label="속성">
            <option value="name">name</option>
            <option value="price">price</option>
            <option value="count">count</option>
          </select>
          <button id="btnTry">꺼내 보기</button>
          <span class="try-result" id="tryResult"></span>
        </div>
      </section>

      <div class="row2">
        <section class="panel">
          <h2>📦 변수</h2>
          <div class="vars" id="vars"></div>
        </section>

        <section class="panel">
          <h2>🧺 장바구니</h2>
          <div class="basket" id="basket"></div>
          <div class="counts" id="counts"></div>
        </section>
      </div>

      <div class="row2">
        <section class="panel">
          <h2>🧾 영수증</h2>
          <div class="receipt">
            <div id="receipt"></div>
            <div class="total"><span>총 구매가격</span><span class="amount" id="totalAmount">0원</span></div>
          </div>
        </section>

        <section class="panel">
          <h2>🖥️ 콘솔 (console.log)</h2>
          <div class="console" id="console"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    // ===== 실습 데이터: 장바구니 배열 =====
    const cart = [
      { name: "사과", price: 100,   count: 10, emoji: "🍎" },
      { name: "배",   price: 1000,  count: 5,  emoji: "🍐" },
      { name: "귤",   price: 10000, count: 10, emoji: "🍊" }
    ];

    const won = function (n) { return n.toLocaleString("ko-KR") + "원"; };

    const CODE = [
      "const cart = [",
      '  { name: "사과", price: 100,   count: 10 },',
      '  { name: "배",   price: 1000,  count: 5  },',
      '  { name: "귤",   price: 10000, count: 10 },',
      "];",
      "",
      "console.log(cart.length);     // 상품 종류 수",
      "console.log(cart[0].name);    // 0번 상자의 이름",
      "",
      "let total = 0;",
      "for (const item of cart) {",
      "  const subtotal = item.price * item.count;",
      "  total += subtotal;",
      "}",
      "console.log(total);"
    ];

    // ===== 단계 만들기 =====
    const steps = [];

    steps.push({
      lines: [],
      explain: '🛒 마트에 왔어요! 사과 10개(개당 100원), 배 5개(1,000원), 귤 10개(10,000원)를 사려고 합니다.<br>' +
               '<b>"다음 ▶"</b>을 눌러 배열에 담는 것부터 시작해 보세요.',
      apply: function () {}
    });

    steps.push({
      lines: [0, 1, 2, 3, 4],
      explain: '<b>배열</b>은 대괄호 <code>[ ]</code> 안에 여러 값을 <b>순서대로</b> 담는 상자 묶음이에요.<br>' +
               '여기서는 상자 하나에 <code>{ name, price, count }</code> 형태의 <b>상품 정보 묶음(객체)</b>이 들어갑니다.<br>' +
               '상자 번호(인덱스)는 <b>0번부터</b> 시작해요: 사과 = 0번, 배 = 1번, 귤 = 2번.',
      apply: function (s) {
        s.shown = true;
        s.appear = true;
        s.vars.cart = "[🍎, 🍐, 🍊] 3칸";
        s.changed = ["cart"];
      }
    });

    steps.push({
      lines: [6],
      explain: '<code>cart.length</code>는 배열에 들어 있는 <b>상자의 개수</b>예요.<br>' +
               '상자가 3개라서 3이 출력됩니다. (마지막 번호는 length − 1 = <b>2</b>번이에요!)' +
               '<span class="calc">cart.length → 3</span>',
      apply: function (s) {
        s.lengthShown = true;
        s.peekAll = true;
        s.logs.push("3");
      }
    });

    steps.push({
      lines: [7],
      explain: '<code>cart[0]</code>은 <b>0번 상자</b>(사과 정보 묶음)를 꺼내고,<br>' +
               '이어서 <code>.name</code>으로 그 안의 <b>이름</b>만 꺼냅니다.<br>' +
               '💡 아래 "직접 해보기"에서 번호와 name/price/count를 바꿔 꺼내 보세요!' +
               '<span class="calc">cart[0].name → "사과"</span>',
      apply: function (s) {
        s.current = 0;
        s.highlightName = true;
        s.logs.push("사과");
      }
    });

    steps.push({
      lines: [9],
      explain: '총액을 모아 둘 변수 <b>total</b>을 만들고 <b>0원</b>에서 시작합니다.<br>' +
               '빈 지갑에서 출발해 상품 금액을 하나씩 더해 갈 거예요.' +
               '<span class="calc">total = 0</span>',
      apply: function (s) {
        s.current = -1;
        s.vars.total = 0;
        s.changed = ["total"];
      }
    });

    // 반복문: 상품마다 3단계 (꺼내기 → 소계 계산 → 총액에 더하기)
    let running = 0;
    cart.forEach(function (p, k) {
      const sub = p.price * p.count;
      const before = running;
      running += sub;
      const after = running;
      const intro = k === 0
        ? '<b>for…of 반복문</b>은 배열의 상자를 <b>0번부터 순서대로 하나씩</b> 꺼내 <code>item</code>에 담아요.<br>'
        : "";

      steps.push({
        lines: [10],
        related: 1 + k,
        explain: intro + '<b>' + (k + 1) + '번째 반복</b>: <code>cart[' + k + ']</code> 상자를 꺼내 <code>item</code>에 담았어요.<br>' +
                 'item = ' + p.emoji + ' { name: "' + p.name + '", price: ' + p.price + ', count: ' + p.count + ' }',
        apply: function (s) {
          s.current = k;
          s.vars.item = p.emoji + " " + p.name;
          delete s.vars.subtotal;
          s.changed = ["item"];
        }
      });

      steps.push({
        lines: [11],
        related: 1 + k,
        explain: '<code>item.price</code>(가격) × <code>item.count</code>(개수)로 <b>' + p.name + '의 소계</b>를 구합니다.<br>' +
                 p.emoji + ' ' + p.name + ' ' + p.count + '개를 장바구니에 담아요!' +
                 '<span class="calc">subtotal = ' + p.price.toLocaleString() + ' × ' + p.count + ' = ' + won(sub) + '</span>',
        apply: function (s) {
          s.vars.subtotal = won(sub);
          for (let i = 0; i < p.count; i++) s.basket.push(p.emoji);
          s.changed = ["subtotal"];
        }
      });

      steps.push({
        lines: [12],
        related: 1 + k,
        explain: '소계를 <b>total</b>에 누적합니다. <code>total += subtotal</code>은 <code>total = total + subtotal</code>과 같아요.' +
                 (k === cart.length - 1 ? '<br>마지막 상자(2번)까지 다 더했어요!' : '') +
                 '<span class="calc">total = ' + won(before) + ' + ' + won(sub) + ' = ' + won(after) + '</span>',
        apply: function (s) {
          s.vars.total = after;
          s.receipt.push({ text: p.emoji + " " + p.name + " " + p.price.toLocaleString() + "×" + p.count, amount: sub });
          s.done = k + 1;
          s.changed = ["total"];
        }
      });
    });

    steps.push({
      lines: [13],
      explain: '배열에 더 꺼낼 상자가 없으니 <b>반복문을 빠져나옵니다.</b><br>' +
               '<code>item</code>과 <code>subtotal</code>은 반복문 { } 안에서만 쓰는 변수라 사라졌어요.<br>' +
               '<span class="calc">1,000 + 5,000 + 100,000 = 106,000원</span>',
      apply: function (s) {
        s.current = -1;
        delete s.vars.item;
        delete s.vars.subtotal;
      }
    });

    steps.push({
      lines: [14],
      explain: '🎉 총 구매가격 <b>106,000원</b>을 출력합니다!<br>' +
               '💡 배열 덕분에 상품이 3개든 100개든 <b>같은 반복문 3줄</b>로 총액을 구할 수 있어요.',
      apply: function (s) {
        s.logs.push("106000");
      }
    });

    // ===== 상태 계산: 처음부터 n단계까지 다시 실행 =====
    function buildState(n) {
      const s = { vars: {}, logs: [], basket: [], receipt: [], current: -1, done: 0, shown: false, lengthShown: false };
      for (let i = 0; i <= n; i++) {
        s.changed = [];
        s.appear = false;
        s.peekAll = false;
        s.highlightName = false;
        steps[i].apply(s);
      }
      return s;
    }

    // ===== 화면 준비 =====
    const $ = function (id) { return document.getElementById(id); };

    function escapeHtml(t) {
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    CODE.forEach(function (text, i) {
      const row = document.createElement("div");
      row.className = "code-line";
      const idx = text.indexOf("//");
      let html = escapeHtml(text);
      if (idx >= 0) html = escapeHtml(text.slice(0, idx)) + '<span class="cm">' + escapeHtml(text.slice(idx)) + "</span>";
      row.innerHTML = '<span class="no">' + (i + 1) + "</span>" + (html || " ");
      $("code").appendChild(row);
    });

    cart.forEach(function (p, i) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.setProperty("--i", i);
      slot.innerHTML =
        '<span class="idx">[' + i + ']</span>' +
        '<div class="emoji">' + p.emoji + '</div>' +
        '<div class="name"><span>' + p.name + '</span></div>' +
        '<dl><dt>price</dt><dd>' + p.price.toLocaleString() + '</dd><dt>count</dt><dd>' + p.count + '</dd></dl>';
      $("shelf").appendChild(slot);
    });

    const slots = $("shelf").children;
    const codeLines = $("code").children;
    let stepIndex = 0;
    let prev = { logs: 0, basket: 0, receipt: 0, total: 0 };
    let countTimer = null;

    // 총액 숫자가 올라가는 애니메이션
    function countTo(from, to) {
      clearInterval(countTimer);
      if (from === to) { $("totalAmount").textContent = won(to); return; }
      const start = performance.now();
      const dur = 700;
      countTimer = setInterval(function () {
        const t = Math.min(1, (performance.now() - start) / dur);
        $("totalAmount").textContent = won(Math.round(from + (to - from) * t));
        if (t === 1) clearInterval(countTimer);
      }, 30);
    }

    function render() {
      const s = buildState(stepIndex);
      const step = steps[stepIndex];

      // 코드 강조
      for (let i = 0; i < codeLines.length; i++) {
        codeLines[i].classList.toggle("active", step.lines.indexOf(i) >= 0);
        codeLines[i].classList.toggle("related", i === step.related);
      }
      if (step.lines[0] === 11 || step.lines[0] === 12) codeLines[10].classList.add("active");

      $("explain").innerHTML = step.explain;

      // 진열대(배열)
      const shelf = $("shelf");
      shelf.classList.toggle("hidden", !s.shown);
      shelf.classList.remove("appear");
      if (s.appear) { void shelf.offsetWidth; shelf.classList.add("appear"); }
      for (let i = 0; i < slots.length; i++) {
        slots[i].classList.toggle("current", i === s.current || s.peekAll);
        slots[i].classList.toggle("done", i < s.done && i !== s.current);
        slots[i].querySelector(".name span").classList.toggle("hl", s.highlightName && i === 0);
      }
      $("shelfNote").textContent = s.lengthShown ? "cart.length = 3  (번호는 0, 1, 2)" : "cart.length = ?";

      // 변수
      const names = ["cart", "total", "item", "subtotal"];
      $("vars").innerHTML = names.map(function (name) {
        const has = Object.prototype.hasOwnProperty.call(s.vars, name);
        const cls = ["var"];
        if (!has) cls.push("empty");
        if (s.changed.indexOf(name) >= 0) cls.push("flash");
        let val = has ? s.vars[name] : "아직 없음";
        if (name === "total" && has) val = won(val);
        return '<div class="' + cls.join(" ") + '"><span class="name">' + name + '</span><span class="val">' + val + "</span></div>";
      }).join("");

      // 장바구니
      if (s.basket.length === 0) {
        $("basket").innerHTML = '<span class="empty">비어 있어요 🧺</span>';
      } else {
        let newIdx = 0;
        $("basket").innerHTML = s.basket.map(function (f, i) {
          if (i >= prev.basket) {
            return '<span class="fruit drop" style="animation-delay:' + (newIdx++ * 70) + 'ms">' + f + "</span>";
          }
          return '<span class="fruit">' + f + "</span>";
        }).join("");
      }
      const countOf = function (e) { return s.basket.filter(function (f) { return f === e; }).length; };
      $("counts").textContent = "🍎 " + countOf("🍎") + "개 · 🍐 " + countOf("🍐") + "개 · 🍊 " + countOf("🍊") + "개";

      // 영수증
      if (s.receipt.length === 0) {
        $("receipt").innerHTML = '<div class="empty">아직 계산한 상품이 없어요</div>';
      } else {
        $("receipt").innerHTML = s.receipt.map(function (r, i) {
          return '<div class="r-line' + (i >= prev.receipt ? " new" : "") + '"><span>' + r.text + "</span><span>" + won(r.amount) + "</span></div>";
        }).join("");
      }
      const total = s.vars.total || 0;
      countTo(stepIndex > 0 && total > prev.total ? prev.total : total, total);

      // 콘솔
      if (s.logs.length === 0) {
        $("console").innerHTML = '<span class="placeholder">아직 출력된 내용이 없어요</span>';
      } else {
        $("console").innerHTML = s.logs.map(function (l, i) {
          return '<div class="ln' + (i >= prev.logs ? " new" : "") + '">' + l + "</div>";
        }).join("");
      }

      prev = { logs: s.logs.length, basket: s.basket.length, receipt: s.receipt.length, total: total };

      // 진행
      $("progress").textContent = "단계 " + stepIndex + " / " + (steps.length - 1);
      $("bar").style.width = (stepIndex / (steps.length - 1) * 100) + "%";
      $("btnPrev").disabled = stepIndex === 0;
      $("btnNext").disabled = stepIndex === steps.length - 1;
    }

    function go(n) {
      stepIndex = Math.max(0, Math.min(steps.length - 1, n));
      render();
      if (stepIndex === steps.length - 1) stopPlay();
    }

    // ===== 자동 재생 =====
    let timer = null;
    function play() {
      if (stepIndex === steps.length - 1) { prev = { logs: 0, basket: 0, receipt: 0, total: 0 }; go(0); }
      $("btnPlay").textContent = "⏸ 멈춤";
      timer = setInterval(function () { go(stepIndex + 1); }, Number($("speed").value));
    }
    function stopPlay() {
      clearInterval(timer);
      timer = null;
      $("btnPlay").textContent = "▶ 자동 재생";
    }
    function togglePlay() { timer ? stopPlay() : play(); }

    $("btnNext").onclick = function () { stopPlay(); go(stepIndex + 1); };
    $("btnPrev").onclick = function () { stopPlay(); go(stepIndex - 1); };
    $("btnReset").onclick = function () { stopPlay(); prev = { logs: 0, basket: 0, receipt: 0, total: 0 }; go(0); };
    $("btnPlay").onclick = togglePlay;
    $("speed").onchange = function () { if (timer) { stopPlay(); play(); } };

    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === "ArrowRight") { stopPlay(); go(stepIndex + 1); }
      else if (e.key === "ArrowLeft") { stopPlay(); go(stepIndex - 1); }
      else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    });

    // ===== 직접 해보기 =====
    function tryIt() {
      const n = Number($("tryIndex").value);
      const prop = $("tryProp").value;
      for (let i = 0; i < slots.length; i++) slots[i].classList.remove("peek");

      if (!Number.isInteger(n)) { $("tryResult").textContent = "정수를 입력해 주세요"; return; }

      const expr = "cart[" + n + "]." + prop;
      if (n >= 0 && n < cart.length) {
        slots[n].classList.add("peek");
        const v = cart[n][prop];
        $("tryResult").textContent = expr + " → " + (typeof v === "string" ? '"' + v + '"' : v);
      } else {
        $("tryResult").textContent = expr + " → 오류! cart[" + n + "] 상자가 없어요 (undefined). 번호는 0~" + (cart.length - 1) + "까지예요";
      }
    }
    $("btnTry").onclick = tryIt;
    $("tryIndex").addEventListener("keydown", function (e) { if (e.key === "Enter") tryIt(); });

    render();
  </script>
</body>
</html>
